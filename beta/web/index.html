<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lighthouse Beta</title>
  <meta name="description" content="Lighthouse Beta: evidence profiles for research papers.">
  <link rel="icon" type="image/webp" href="/icon.webp">
  <script>
    // Theme before first paint, shared key with the current Lighthouse site.
    (function () {
      var t = null; try { t = localStorage.getItem('theme'); } catch (_) {}
      var dark = t === 'dark' || (t === null && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
