services:
  - type: web
    name: forrt-lighthouse
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: |
      pip install uv
      uv sync --frozen
      uv run python import_xlsx.py FORRT_Lighthouse_Data.xlsx --retractions-csv data/retraction_watch.csv
    startCommand: sh start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: FLASK_DEBUG
        value: "0"
      # Use the interpreter Render provides (PYTHON_VERSION above) instead of
      # letting uv fetch its own, which may not survive into the run stage.
      - key: UV_PYTHON_DOWNLOADS
        value: "never"
